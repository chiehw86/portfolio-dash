# rev 2026-08-30g:導航列加「已出清」捷徑
name: build-dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 0-4'       # 台北 07:00(台灣基金淨值每日更新)
    - cron: '0,30 0-5 * * 1-5'   # 台北 08:00–13:30 每半小時(亞股)
    - cron: '0 6 * * 1-5'        # 台北 14:00(台股收盤後、日股收盤)
    - cron: '30 13-15 * * 1-5'   # 台北 21:30/22:30/23:30(美股)
    - cron: '0 14-16 * * 1-5'    # 台北 22:00/23:00/00:00(美股)
    - cron: '0 20 * * 1-5'       # 台北 04:00(美股收盤快照)
    - cron: '0 10 * * 1-5'       # 台北 18:00(每日結算:走勢圖在這一輪才記一筆)
permissions:
  contents: write
concurrency:
  # cancel-in-progress 曾經是 true:任何新的觸發都會把正在跑的那一輪殺掉。
  # 平常只是噪音(下一輪照樣會補),但台北 18:00 的每日結算在那個時段只有一次排程 ——
  # 那一輪被殺掉,走勢圖就永遠少一天,而且畫面上完全看不出來。
  # 改成排隊:單輪約 1–2 分鐘,排程間隔 30 分鐘,不會塞車。
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 釘 commit SHA:tag 可被移動,而這個 action 決定了後續每一步用的 python 二進位,
      # 它跑在 secret 之前不構成緩解(可植入 sitecustomize.py 讀取後續步驟的 env)。
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          # 這一步之後的每個步驟 env 裡都有全部 secret,所以依賴必須是可重現的。
          # 只 pin 頂層套件擋不到 yfinance 那 25 個「>=」的傳遞依賴 —— 那才是攻擊面。
          echo '' | base64 -d > requirements.txt
          echo 'eyJuYW1lIjoiZGFzaCIsInByaXZhdGUiOnRydWUsImRlcGVuZGVuY2llcyI6eyJzdGF0aWNyeXB0IjoiMy41LjQifX0=' | base64 -d > package.json
          echo '' | base64 -d > package-lock.json
          pip -q install --require-hashes -r requirements.txt
          npm ci --silent --ignore-scripts
      - name: Materialize build scripts
        run: |
          echo '' | base64 -d > v3.css
          echo '' | base64 -d > v3.js
          echo '' | base64 -d > build_dashboard_v3.py
          echo '' | base64 -d > fetch_action.py
          echo '' | base64 -d > sync_crypto.py
          echo '' | base64 -d > merge_overlay.py
          echo '' | base64 -d > append_history.py
          echo '' | base64 -d > backfill_history.py
          echo '' | base64 -d > apply_statement.py
          echo '' | base64 -d > leak_check.py
      - name: Write portfolio bundle from secret
        env:
          PORTFOLIO_BUNDLE: ${{ secrets.PORTFOLIO_BUNDLE }}
        run: |
          printf '%s' "$PORTFOLIO_BUNDLE" > bundle.json
          python -c "import json;b=json.load(open('bundle.json'));json.dump(b['portfolio'],open('portfolio.json','w'),ensure_ascii=False);json.dump(b['units'],open('units.json','w'))"
      - name: Apply web edits (overlay)
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 覆寫檔不存在時預設中止(有 token 的人刪掉它就能讓網頁修改全部消失而建置綠燈);
          # 只有第一次部署才把這個 repo variable 設成 1,跑過一次後就拿掉。
          OVERLAY_BOOTSTRAP: ${{ vars.OVERLAY_BOOTSTRAP }}
        run: python merge_overlay.py
      - name: Leak check (public scripts must not name holdings)
        # 拒絕名單由 bundle + 覆寫檔的持倉建立;命中就中止、不發佈。log 只印檔名:行號。
        run: python leak_check.py
      - name: Fetch quotes
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_action.py
      - name: Apply broker statement
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python apply_statement.py
      - name: Backfill history + benchmark columns (one-off)
        continue-on-error: true       # 補資料失敗不該連帶讓當天的結算與發佈停擺
        env:
          HISTORY_KEY: ${{ secrets.HISTORY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python backfill_history.py
      - name: Append history
        env:
          # VIEW_PASSWORD 已不再交給這一步:以前留著是為了讀「用觀看密碼派生金鑰」的舊歷史檔,
          # 那條路徑讓持觀看密碼者能偽造整份歷史,2026-09-08 已移除。
          HISTORY_KEY: ${{ secrets.HISTORY_KEY }}
          HISTORY_KEY_OLD: ${{ secrets.HISTORY_KEY_OLD }}
          HISTORY_BOOTSTRAP: ${{ vars.HISTORY_BOOTSTRAP }}
          # 歷史檔加密時間超過 10 天視為被換回舊版而中止;確認要沿用舊檔時暫時設成 1
          HISTORY_ACCEPT_OLD: ${{ vars.HISTORY_ACCEPT_OLD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python append_history.py
      - name: Build dashboard
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: python build_dashboard_v3.py
      - name: Encrypt and assemble site
        env:
          VIEW_PASSWORD: ${{ secrets.VIEW_PASSWORD }}
        run: |
          # 用 STATICRYPT_PASSWORD 環境變數而不是 -p:argv 同 job 內任何程序都讀得到
          # 固定 salt:沒有這個檔時 staticrypt 每次隨機產生,導致「記住我」存的
          # hash 每天失效、天天都要重打密碼。salt 本來就嵌在公開的 index.html 裡,
          # 不是秘密,寫死在 workflow 沒有安全損失。
          printf '{"salt":"1d29a6e0e5642f56a745a77a5e12227b"}' > .staticrypt.json
          # 直接用 npm ci 裝好的那一份;npx 在找不到本地套件時會自動從 registry 抓最新版來跑,
          # 而 VIEW_PASSWORD 就在它的環境裡。
          STATICRYPT_PASSWORD="$VIEW_PASSWORD" ./node_modules/.bin/staticrypt dashboard.html --remember 30 -d enc_out --short \
            --template-title "投資組合" --template-placeholder "觀看密碼" \
            --template-button "解鎖" --template-error "密碼錯誤,請再試一次" \
            --template-remember "記住我 30 天"
          mkdir -p site
          # 同時注入 noindex 與 icon(登入頁是 StatiCrypt 外殼,head 不歸 build script 管)
          sed 's|<meta charset="utf-8" />|<meta charset="utf-8" /><meta name="robots" content="noindex, nofollow" /><meta name="theme-color" content="#0f172a" /><link rel="icon" type="image/png" href="data:image/png;base64," /><script>try{var n=performance.getEntriesByType("navigation")[0];if(!location.search\&\&n\&\&n.transferSize===0)location.replace(location.pathname+"?t="+Date.now());}catch(e){}</script><link rel="apple-touch-icon" href="data:image/png;base64," />|' enc_out/dashboard.html > site/index.html
          # history.enc 與 nav-cache.enc 已改存 main 分支的 data/,不再發佈到網站上。
          # 它們前端根本不會 fetch(走勢圖用頁內嵌的 __HIST__),放在公開網址上
          # 只是讓人可以「先把密文存起來,等金鑰哪天外洩再回頭解」。
          # 網站現在只有 index.html / robots.txt / .nojekyll 三個檔。
          # meta noindex 只管得到 index.html;history.enc / nav-cache.enc 是無認證的
          # 公開 URL,Allow 等於邀請 Wayback 之類的服務永久保存密文 ——
          # 金鑰若在未來任何時點外洩,那些快照就能被回溯解密。
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          touch site/.nojekyll
          # 失敗的 curl 會留下 0 byte 檔,清掉以免把空檔當成有效內容發佈
          grep -q 'noindex' site/index.html || { echo "::error::noindex 未注入(staticrypt 模板可能已變更)"; exit 1; }
      - name: Push page to Cloudflare KV
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV: ${{ secrets.CLOUDFLARE_KV_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "未設定 Cloudflare secrets,略過"; exit 0; fi
          # token 與帳號識別走 curl 設定檔(stdin),不放 argv:同一個 job 裡任何程序都讀得到 /proc/*/cmdline,
          # 而這顆 Cloudflare token 是長期有效的(不像 GITHUB_TOKEN 在 job 結束就作廢)。
          code=$(curl -s -o /tmp/kv.json -w '%{http_code}' -K - <<EOF
          request = "PUT"
          url = "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$CF_KV/values/index.html"
          header = "Authorization: Bearer $CF_TOKEN"
          header = "Content-Type: text/plain"
          data-binary = "@site/index.html"
          EOF
          )
          if [ "$code" != "200" ]; then
            echo "::error::寫入 Cloudflare KV 失敗 HTTP $code"
            # 不印回應內容:錯誤訊息可能帶帳號識別資訊,而 log 在公開 repo 上看得到
            exit 1
          fi
          echo "KV 已更新"
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "update"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
