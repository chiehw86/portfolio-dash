name: build-dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 0-4'       # 台北 07:00(台灣基金淨值每日更新)
    - cron: '0,30 0-5 * * 1-5'   # 台北 08:00–13:30 每半小時(亞股)
    - cron: '0 6 * * 1-5'        # 台北 14:00(台股收盤後、日股收盤)
    - cron: '30 13-15 * * 1-5'   # 台北 21:30/22:30/23:30(美股)
    - cron: '0 14-16 * * 1-5'    # 台北 22:00/23:00/00:00(美股)
    - cron: '0 20 * * 1-5'       # 台北 04:00(美股收盤快照)
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip -q install yfinance==1.6.0 cryptography==50.0.0
          npm -s install staticrypt@3.5.4 --ignore-scripts
      - name: Materialize build scripts
        run: |
          echo '' | base64 -d > v3.css
          echo '' | base64 -d > v3.js
          echo '' | base64 -d > build_dashboard_v3.py
          echo '' | base64 -d > fetch_action.py
          echo '' | base64 -d > sync_crypto.py
          echo '' | base64 -d > merge_overlay.py
          echo '' | base64 -d > append_history.py
      - name: Write portfolio bundle from secret
        env:
          PORTFOLIO_BUNDLE: ${{ secrets.PORTFOLIO_BUNDLE }}
        run: |
          printf '%s' "$PORTFOLIO_BUNDLE" > bundle.json
          python -c "import json;b=json.load(open('bundle.json'));json.dump(b['portfolio'],open('portfolio.json','w'),ensure_ascii=False);json.dump(b['units'],open('units.json','w'))"
      - name: Apply web edits (overlay)
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python merge_overlay.py
      - name: Fetch quotes
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_action.py
      - name: Append history
        env:
          VIEW_PASSWORD: ${{ secrets.VIEW_PASSWORD }}
          HISTORY_KEY: ${{ secrets.HISTORY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python append_history.py
      - name: Build dashboard
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: python build_dashboard_v3.py
      - name: Encrypt and assemble site
        env:
          VIEW_PASSWORD: ${{ secrets.VIEW_PASSWORD }}
        run: |
          npx staticrypt dashboard.html -p "$VIEW_PASSWORD" --remember 30 -d enc_out --short
          mkdir -p site
          sed 's|<meta charset="utf-8" />|<meta charset="utf-8" /><meta name="robots" content="noindex, nofollow" />|' enc_out/dashboard.html > site/index.html
          cp nav-cache.enc site/ 2>/dev/null \
            || curl -sfL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.raw" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/nav-cache.enc?ref=gh-pages" -o site/nav-cache.enc \
            || true
          cp history.enc site/ 2>/dev/null \
            || curl -sfL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.raw" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/history.enc?ref=gh-pages" -o site/history.enc \
            || true
          printf 'User-agent: *\nAllow: /\n' > site/robots.txt
          touch site/.nojekyll
          # 失敗的 curl 會留下 0 byte 檔,清掉以免把空檔當成有效內容發佈
          [ -s site/nav-cache.enc ] || rm -f site/nav-cache.enc
          [ -s site/history.enc ]   || rm -f site/history.enc
          # gh-pages 是 orphan branch + push -f,少一個檔就等於刪除。
          # 歷史檔取不到時寧可讓這一輪紅字中止,也不能發佈出去把歷史清空。
          if [ ! -s site/history.enc ]; then
            echo "::error::history.enc 取不到,中止發佈以免清空資產歷史"
            exit 1
          fi
      - name: Publish to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "update"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
