# rev 2026-08-30g:導航列加「已出清」捷徑
name: build-dashboard
# v144:GitHub 自己的 schedule 全部拿掉。2026-09-21 起 GitHub 對這個 repo 的排程大量不建立 run
# (一天 22 輪只跑 3~4 輪;API 裡連 queued 都沒有,不是延遲是根本沒觸發;分鐘 +7 無效)。
# 改由外部排程(Cloudflare Worker 的 Cron Trigger)每小時 :07 / :37 打 workflow_dispatch,
# 2026-09-23 起實測 47 輪無一漏。哪些時段要跑、哪一輪要備份,由下面的 gate job 用台北時間判斷,
# 外部排程不必知道時刻表(它只負責準時按開始鍵)。
on:
  workflow_dispatch:
    inputs:
      backup:
        description: '這一輪也備份加密檔(平日 18:07 那一輪會自動備份,平常不用勾)'
        type: boolean
        default: false
      force:
        description: '忽略時刻表,現在就跑(週六 08:00 後與週日預設略過)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  # cancel-in-progress 曾經是 true:任何新的觸發都會把正在跑的那一輪殺掉。
  # 平常只是噪音(下一輪照樣會補),但台北 18:00 的每日結算在那個時段只有一次排程 ——
  # 那一輪被殺掉,走勢圖就永遠少一天,而且畫面上完全看不出來。
  # 改成排隊:單輪約 1–2 分鐘,排程間隔 30 分鐘,不會塞車。
  group: build
  cancel-in-progress: false
jobs:
  gate:
    # 外部排程一天 48 次、不分平日週末;這裡照原本的時刻表決定要不要跑:
    # 週一至週五全跑,週六只跑 07:07 那一輪(補美債週五收盤),週日不跑。
    # 備份只在週一至週五 18:07 那一輪(每日結算)做,或手動勾 backup。
    # 判斷式抽成 GATE_NOW 可覆寫,tests/tt7/gate.py 拿同一段 shell 跑各種時刻。
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      backup: ${{ steps.g.outputs.backup }}
    steps:
      - id: g
        env:
          FORCE: ${{ inputs.force }}
          BACKUP: ${{ inputs.backup }}
        run: |
          NOW="${GATE_NOW:-$(TZ=Asia/Taipei date +%u/%H/%M)}"
          DOW="${NOW%%/*}"; REST="${NOW#*/}"; HH=$((10#${REST%%/*})); MM=$((10#${REST#*/}))
          RUN=1; BK=0
          if [ "$DOW" = 7 ] || { [ "$DOW" = 6 ] && [ "$HH" -ge 8 ]; }; then RUN=0; fi
          if [ "$FORCE" = true ]; then RUN=1; fi
          if [ "$DOW" -le 5 ] && [ "$HH" -eq 18 ] && [ "$MM" -lt 30 ]; then BK=1; fi
          if [ "$BACKUP" = true ]; then BK=1; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "backup=$BK" >> "$GITHUB_OUTPUT"
          echo "gate: 台北 $NOW run=$RUN backup=$BK"
          [ "$RUN" = 1 ] || echo "::notice::時刻表外(週六 08:00 後 / 週日),這一輪略過;要跑請手動觸發並勾 force"
  build:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    steps:
      # 釘 commit SHA:tag 可被移動,而這個 action 決定了後續每一步用的 python 二進位,
      # 它跑在 secret 之前不構成緩解(可植入 sitecustomize.py 讀取後續步驟的 env)。
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          # 這一步之後的每個步驟 env 裡都有全部 secret,所以依賴必須是可重現的。
          # 只 pin 頂層套件擋不到 yfinance 那 25 個「>=」的傳遞依賴 —— 那才是攻擊面。
          echo '' | base64 -d | gunzip > requirements.txt
          echo 'H4sIAAAAAAACAw3LMQrAIBAEwL9sLTYmjb85dCEWEbm7BIL499gOzESXm8ioYhcChrZXfIPrw4DKwV7ZS6MhT5iLt6Lf8F1SPOOBtX5HXTD/RAAAAA==' | base64 -d | gunzip > package.json
          echo '' | base64 -d | gunzip > package-lock.json
          pip -q install --require-hashes -r requirements.txt
          npm ci --silent --ignore-scripts
      - name: Materialize build scripts
        run: |
          echo '' | base64 -d | gunzip > v3.css
          echo '' | base64 -d | gunzip > v3.js
          echo '' | base64 -d | gunzip > build_dashboard_v3.py
          echo '' | base64 -d | gunzip > fetch_action.py
          echo '' | base64 -d | gunzip > sync_crypto.py
          echo '' | base64 -d | gunzip > merge_overlay.py
          echo '' | base64 -d | gunzip > append_history.py
          echo '' | base64 -d | gunzip > backfill_history.py
          echo '' | base64 -d | gunzip > apply_statement.py
          echo '' | base64 -d | gunzip > leak_check.py
      # 鏡像:把這一輪實際執行的腳本原樣寫進 repo 的 scripts/,**只給人看**。
      # 建置永遠跑上一步從這個 yml 解出來的那一份,不會去讀 scripts/。
      #
      # 為什麼不乾脆讓建置直接跑 scripts/ 裡的檔(那樣改一行就不必重發整包):
      # 改 `.github/workflows/` 需要 token 的 workflows 權限,改一般檔案只要 contents 權限,
      # 而解密後的頁面裡嵌著一顆**只有 contents 讀寫**的 token。一旦建置去跑 scripts/,
      # 「拿到觀看密碼」就等於「可以改一段會拿到全部 secret 的程式碼」——
      # 那是把編輯持倉的權限升級成任意程式碼執行,不能換。
      #
      # 有了鏡像的好處(不用付上面那個代價):可以在 GitHub 上逐檔 diff、看每一版改了什麼、
      # 逐檔查歷史;每日的公開面掃描也不必再自己解 base64。
      # 內容一律以 yml 為準覆寫回去,所以有人改了鏡像,下一輪就被改回來。
      - name: Mirror scripts to repo (read-only)
        continue-on-error: true          # 鏡像失敗不該讓當天的發佈停擺
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from sync_crypto import gh_read, gh_write
          FILES = ["v3.css", "v3.js", "build_dashboard_v3.py", "fetch_action.py",
                   "sync_crypto.py", "merge_overlay.py", "append_history.py",
                   "backfill_history.py", "apply_statement.py", "leak_check.py"]
          n = 0
          for f in FILES:
              if not os.path.exists(f):
                  continue
              new = open(f, "rb").read()
              try:
                  if gh_read("scripts/" + f) == new:
                      continue
              except Exception:
                  pass
              gh_write("scripts/" + f, new, message="scripts")
              n += 1
          print(f"scripts mirror: {n} updated")
          PY
      - name: Write portfolio bundle from secret
        env:
          PORTFOLIO_BUNDLE: ${{ secrets.PORTFOLIO_BUNDLE }}
        run: |
          printf '%s' "$PORTFOLIO_BUNDLE" > bundle.json
          # secret 單一值上限 48 KB。這個 bundle 五週長了 45%,逼近上限時 run 會直接拿到空值 ——
          # 形狀跟害過我們凍結 24 小時的「yml 超過 500 KB」一模一樣,所以提早叫。只印大小,不印內容。
          _n=$(wc -c < bundle.json)
          if [ "$_n" -gt 40000 ]; then echo "::warning::PORTFOLIO_BUNDLE 已 ${_n} bytes(上限 49152),該搬成加密檔了"; fi
          python -c "import json;b=json.load(open('bundle.json'));json.dump(b['portfolio'],open('portfolio.json','w'),ensure_ascii=False);json.dump(b['units'],open('units.json','w'))"
      - name: Apply web edits (overlay)
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 覆寫檔不存在時預設中止(有 token 的人刪掉它就能讓網頁修改全部消失而建置綠燈);
          # 只有第一次部署才把這個 repo variable 設成 1,跑過一次後就拿掉。
          OVERLAY_BOOTSTRAP: ${{ vars.OVERLAY_BOOTSTRAP }}
        run: python merge_overlay.py
      - name: Leak check (public scripts must not name holdings)
        # 拒絕名單由 bundle + 覆寫檔的持倉建立;命中就中止、不發佈。log 只印檔名:行號。
        run: python leak_check.py
      - name: Fetch quotes
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_action.py
      - name: Apply broker statement
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python apply_statement.py
      - name: Backfill history + benchmark columns (one-off)
        continue-on-error: true       # 補資料失敗不該連帶讓當天的結算與發佈停擺
        env:
          HISTORY_KEY: ${{ secrets.HISTORY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python backfill_history.py
      - name: Append history
        env:
          # VIEW_PASSWORD 已不再交給這一步:以前留著是為了讀「用觀看密碼派生金鑰」的舊歷史檔,
          # 那條路徑讓持觀看密碼者能偽造整份歷史,2026-09-08 已移除。
          HISTORY_KEY: ${{ secrets.HISTORY_KEY }}
          HISTORY_KEY_OLD: ${{ secrets.HISTORY_KEY_OLD }}
          HISTORY_BOOTSTRAP: ${{ vars.HISTORY_BOOTSTRAP }}
          # 歷史檔加密時間超過 10 天視為被換回舊版而中止;確認要沿用舊檔時暫時設成 1
          HISTORY_ACCEPT_OLD: ${{ vars.HISTORY_ACCEPT_OLD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python append_history.py
      # 備份五個加密檔。為什麼要:它們是使用者修改與走勢圖的唯一副本,而頁面裡嵌著的
      # 同步 token 有 contents 寫入權 —— 拿到觀看密碼的人可以把它們刪掉或寫壞。
      # git 歷史救得回來,但「repo 轉私有順便清歷史」是待辦之一,清了就沒了。
      # Actions artifact 在 contents 權限碰不到的地方(刪它要 actions 權限,兩顆 token 都沒有),
      # 而且不需要任何額外設定或新的 secret。內容本來就是密文,跟放在 main 上一樣公開,沒有新增曝險。
      # 只在每日結算那一輪備份(一天一份,保留 90 天;v144 起由 gate job 判斷 18:07 那輪,或手動勾 backup)。
      - name: Back up encrypted data (daily)
        if: needs.gate.outputs.backup == '1'
        continue-on-error: true          # 備份失敗不該讓當天的發佈停擺
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from sync_crypto import gh_read
          os.makedirs("backup", exist_ok=True)
          n = 0
          for f in ("overlay.enc", "data/history.enc", "data/px.enc",
                    "data/nav-cache.enc", "data/statement.enc"):
              try:
                  b = gh_read(f)
              except Exception:
                  b = None
              if b:
                  open("backup/" + f.replace("/", "__"), "wb").write(b); n += 1
          print(f"backup: {n} files")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.gate.outputs.backup == '1'
        continue-on-error: true
        with:
          name: enc-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
          if-no-files-found: warn
      - name: Build dashboard
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: python build_dashboard_v3.py
      - name: Encrypt and assemble site
        env:
          VIEW_PASSWORD: ${{ secrets.VIEW_PASSWORD }}
        run: |
          # 用 STATICRYPT_PASSWORD 環境變數而不是 -p:argv 同 job 內任何程序都讀得到
          # 固定 salt:沒有這個檔時 staticrypt 每次隨機產生,導致「記住我」存的
          # hash 每天失效、天天都要重打密碼。salt 本來就嵌在公開的 index.html 裡,
          # 不是秘密,寫死在 workflow 沒有安全損失。
          printf '{"salt":"1d29a6e0e5642f56a745a77a5e12227b"}' > .staticrypt.json
          # 直接用 npm ci 裝好的那一份;npx 在找不到本地套件時會自動從 registry 抓最新版來跑,
          # 而 VIEW_PASSWORD 就在它的環境裡。
          STATICRYPT_PASSWORD="$VIEW_PASSWORD" ./node_modules/.bin/staticrypt dashboard.html --remember 30 -d enc_out --short \
            --template-title "投資組合" --template-placeholder "觀看密碼" \
            --template-button "解鎖" --template-error "密碼錯誤,請再試一次" \
            --template-remember "記住我 30 天"
          mkdir -p site
          # 同時注入 noindex 與 icon(登入頁是 StatiCrypt 外殼,head 不歸 build script 管)
          sed 's|<meta charset="utf-8" />|<meta charset="utf-8" /><meta name="robots" content="noindex, nofollow" /><meta name="theme-color" content="#0f172a" /><link rel="icon" type="image/png" href="data:image/png;base64," /><script>try{var n=performance.getEntriesByType("navigation")[0];if(!location.search\&\&n\&\&n.transferSize===0)location.replace(location.pathname+"?t="+Date.now());}catch(e){}</script><link rel="apple-touch-icon" href="data:image/png;base64," />|' enc_out/dashboard.html > site/index.html
          # history.enc 與 nav-cache.enc 已改存 main 分支的 data/,不再發佈到網站上。
          # 它們前端根本不會 fetch(走勢圖用頁內嵌的 __HIST__),放在公開網址上
          # 只是讓人可以「先把密文存起來,等金鑰哪天外洩再回頭解」。
          # 網站現在只有 index.html / robots.txt / .nojekyll / build.txt 四個檔。
          # meta noindex 只管得到 index.html;history.enc / nav-cache.enc 是無認證的
          # 公開 URL,Allow 等於邀請 Wayback 之類的服務永久保存密文 ——
          # 金鑰若在未來任何時點外洩,那些快照就能被回溯解密。
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          touch site/.nojekyll
          # v143:build.txt = 這一版的戳記(報價時刻 + 版本 + 指紋),前端拿它判斷有沒有更新的一版
          cp build.txt site/build.txt
          # 失敗的 curl 會留下 0 byte 檔,清掉以免把空檔當成有效內容發佈
          grep -q 'noindex' site/index.html || { echo "::error::noindex 未注入(staticrypt 模板可能已變更)"; exit 1; }
      - name: Push page to Cloudflare KV
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV: ${{ secrets.CLOUDFLARE_KV_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "未設定 Cloudflare secrets,略過"; exit 0; fi
          # token 與帳號識別走 curl 設定檔(stdin),不放 argv:同一個 job 裡任何程序都讀得到 /proc/*/cmdline,
          # 而這顆 Cloudflare token 是長期有效的(不像 GITHUB_TOKEN 在 job 結束就作廢)。
          code=$(curl -s -o /tmp/kv.json -w '%{http_code}' -K - <<EOF
          request = "PUT"
          url = "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$CF_KV/values/index.html"
          header = "Authorization: Bearer $CF_TOKEN"
          header = "Content-Type: text/plain"
          data-binary = "@site/index.html"
          EOF
          )
          if [ "$code" != "200" ]; then
            echo "::error::寫入 Cloudflare KV 失敗 HTTP $code"
            # 不印回應內容:錯誤訊息可能帶帳號識別資訊,而 log 在公開 repo 上看得到
            exit 1
          fi
          echo "KV 已更新"
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "update"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
